// ---------------------------------------------------------------------------
// Relocated Termux prefix.
//
// This prefix was built for /data/user/0/com.dsh.launcher/files/usr (another app's
// private directory, unreadable from here), so every compiled-in path in apt
// and dpkg is wrong. Each one is overridden below.
// ---------------------------------------------------------------------------
Dir "/data/user/0/com.dsh.launcher/files/usr";

Dir::State "/data/user/0/com.dsh.launcher/files/usr/var/lib/apt";
Dir::State::status "/data/user/0/com.dsh.launcher/files/usr/var/lib/dpkg/status";
Dir::Cache "/data/user/0/com.dsh.launcher/files/usr/var/cache/apt";
Dir::Etc "/data/user/0/com.dsh.launcher/files/usr/etc/apt";
Dir::Etc::parts "/data/user/0/com.dsh.launcher/files/usr/etc/apt/apt.conf.d";
Dir::Etc::trusted "/data/user/0/com.dsh.launcher/files/usr/var/lib/dsh-apt/trusted.gpg";
Dir::Etc::trustedparts "/data/user/0/com.dsh.launcher/files/usr/var/lib/dsh-apt/trusted.gpg.d";
Dir::Log "/data/user/0/com.dsh.launcher/files/usr/var/log/apt";

Dir::Bin::Methods "/data/user/0/com.dsh.launcher/files/usr/lib/apt/methods-dsh";
Dir::Bin::apt-key "/data/user/0/com.dsh.launcher/files/usr/var/lib/dsh-apt/bin/apt-key";
Dir::Bin::dpkg "/data/user/0/com.dsh.launcher/files/usr/var/lib/dsh-apt/bin/dpkg-wrapper";
Dir::Bin::gzip "/data/user/0/com.dsh.launcher/files/usr/bin/gzip";
Dir::Bin::bzip2 "/data/user/0/com.dsh.launcher/files/usr/bin/bzip2";
Dir::Bin::xz "/data/user/0/com.dsh.launcher/files/usr/bin/xz";
Dir::Bin::zstd "/data/user/0/com.dsh.launcher/files/usr/bin/zstd";
Dir::Bin::lz4 "/data/user/0/com.dsh.launcher/files/usr/bin/lz4";
Dir::Bin::lzma "/data/user/0/com.dsh.launcher/files/usr/bin/xz";

// These two are LISTS whose compiled-in entry points at the unreadable
// com.termux prefix, and apt walks every entry in order. Clear first,
// otherwise the broken default entry is still tried and kills the
// planner/solver sub-process.
#clear Dir::Bin::planners;
Dir::Bin::planners:: "/data/user/0/com.dsh.launcher/files/usr/lib/apt/planners";
#clear Dir::Bin::solvers;
Dir::Bin::solvers:: "/data/user/0/com.dsh.launcher/files/usr/lib/apt/solvers";

// .deb payloads are rooted at ./data/user/0/com.dsh.launcher/files/usr, so dpkg has to
// install through a shim root that maps that tree back onto this prefix.
DPkg::Options { "--root=/data/user/0/com.dsh.launcher/files/.termux-root"; "--force-script-chrootless"; "--force-confold"; };

DPkg::Path "/data/user/0/com.dsh.launcher/files/usr/bin:/system/bin:/data/user/0/com.dsh.launcher/files/runtime/bin";
Acquire::https::CaInfo "/data/user/0/com.dsh.launcher/files/usr/etc/tls/cert.pem";

// One relocation sweep per apt transaction. dpkg calls are per package, and a
// full sweep over ~13000 files costs ~2.7s, so doing it inside the dpkg wrapper
// made a 107-package install take minutes. The wrapper defers here when it sees
// apt's --status-fd.
DPkg::Post-Invoke { "/data/user/0/com.dsh.launcher/files/usr/var/lib/dsh-apt/bin/relocate-all"; };
